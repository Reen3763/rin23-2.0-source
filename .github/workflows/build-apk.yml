name: Build APK (arm64)

on:
  workflow_dispatch:

jobs:
  build:
    name: Flutter release APK (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Toolchain versions
        run: |
          flutter --version
          java -version

      - name: Prepare .env.json
        run: |
          if [ ! -f .env.json ]; then cp .env.example.json .env.json; fi
          cat .env.json

      - name: Install SDK platform 37 + NDK 29
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "ndk;29.0.13599879" || true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter gen-l10n
        run: flutter gen-l10n || true

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64 --dart-define-from-file=.env.json

      - name: Collect APK
        run: |
          ls -lh build/app/outputs/flutter-apk/
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk "out/Rin23-2.0-${GITHUB_SHA::7}-arm64.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rin23-2.0-apk-arm64
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
