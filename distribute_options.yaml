output: dist/
releases:
  - name: release-linux
    jobs:
      - name: linux-appimage
        package:
          platform: linux
          target: appimage
          build_args:
            dart-define-from-file: .env.json
  - name: release-android
    jobs:
      - name: android-apk
        package:
          platform: android
          target: apk
          build_args:
            dart-define-from-file: .env.json
  - name: release-windows
    jobs: 
      - name: windows-exe
        package:
          platform: windows
          target: exe
          build_args:
            dart-define-from-file: .env.json